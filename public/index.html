<!doctype html>
<html lang="ca">
  <head>
    <meta charset="utf-8" />
    <!--
      viewport-fit=cover: the page reaches under the notch and the home bar,
      and the app adds the safe-area space itself, like on the iPhone.
      maximum-scale=1: Safari doesn't zoom in when a field is tapped (iOS
      still lets you pinch to zoom).
    -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover"
    />
    <title>%WEB_TITLE%</title>
    <!-- The theme's background colours (src/theme/colors.ts), light and dark. -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#FAFAF9" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121416" />
    <meta name="color-scheme" content="light dark" />
    <!--
      Add to Home Screen: the name, the icon (iOS ignores the manifest's
      icons and uses apple-touch-icon), and it opens on its own, without
      Safari's bars. The status bar keeps its own strip in the theme-color
      above, with dark or light text to match.
    -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pretty Strong" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- The launch screen when opened from the Home Screen: the logo on the
         background, like the iPhone app's splash. iOS needs one per screen
         size, light and dark. -->
    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-1320x2868-light.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 440px) and (device-height: 956px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: dark)" href="/splash/splash-1320x2868-dark.png" />
    <link rel="apple-touch-startup-image" media="screen and (device-width: 430px) and (device-height: 932px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait) and (prefers-color-scheme: light)" href="/splash/splash-1290x2796-light.png" />

    <style id="expo-reset">
      html,
      body {
        height: 100%;
      }
      html {
        /* Safari mustn't enlarge text by itself. */
        -webkit-text-size-adjust: 100%;
        text-size-adjust: 100%;
        /* No double-tap zoom: quick taps on a stepper stay taps. */
        touch-action: manipulation;
      }
      body {
        /* Each screen scrolls inside itself, like the app; the page never
           scrolls or bounces. */
        overflow: hidden;
        overscroll-behavior: none;
        margin: 0;
        background-color: #fafaf9;
        -webkit-tap-highlight-color: transparent;
      }
      /* The browser's thick focus ring around a field being typed in; the
         app (like iOS) shows the field and its cursor only. */
      input:focus,
      textarea:focus {
        outline: none;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background-color: #121416;
        }
      }
      #root {
        display: flex;
        flex: 1;
        height: 100%;
        /* The visible height, whichever Safari bars are showing. */
        height: 100dvh;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
